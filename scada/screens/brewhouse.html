<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brewhouse - SCADA</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../../assets/brewhouse.css">
</head>
<body>
  <header class="hdr"><h1>Brewhouse Control</h1><div class="batch-info"><span class="batch-id">Batch #2024-042</span><span class="state">BOILING</span></div></header>
  <nav class="nav">
    <a href="../../index.html">Overview</a>
    <a href="brewhouse.html" class="active">Brewhouse</a>
    <a href="fermentation.html">Fermentation</a>
    <a href="recipes.html">Recipes</a>
    <a href="history.html">History</a>
  </nav>
  <main style="padding:15px">
    <div class="bh-grid">
      <div class="vessel-card">
        <h3>HLT</h3>
        <svg class="vessel-svg" viewBox="0 0 100 150">
          <rect x="10" y="20" width="80" height="110" fill="none" stroke="#3d2418" stroke-width="2" rx="4"/>
          <rect x="10" y="40" width="80" height="90" fill="#4a90e2" opacity="0.6" rx="4"/>
          <text x="50" y="15" text-anchor="middle" fill="#ffa500" font-size="10">450L</text>
          <text x="50" y="85" text-anchor="middle" fill="#fff" font-size="16">75°C</text>
        </svg>
        <div class="ctrl-panel">
          <button class="ctrl-btn">HEAT</button>
          <button class="ctrl-btn active">CIRC</button>
          <button class="ctrl-btn">DRAIN</button>
        </div>
      </div>
      <div class="vessel-card">
        <h3>Mash Tun</h3>
        <svg class="vessel-svg" viewBox="0 0 100 150">
          <rect x="10" y="20" width="80" height="110" fill="none" stroke="#3d2418" stroke-width="2" rx="4"/>
          <rect x="10" y="50" width="80" height="80" fill="#8b4513" opacity="0.6" rx="4"/>
          <text x="50" y="15" text-anchor="middle" fill="#ffa500" font-size="10">380L</text>
          <text x="50" y="90" text-anchor="middle" fill="#0f0" font-size="16">67°C</text>
        </svg>
        <div class="ctrl-panel">
          <button class="ctrl-btn">RECIRC</button>
          <button class="ctrl-btn">SPARGE</button>
          <button class="ctrl-btn">DRAIN</button>
        </div>
      </div>
      <div class="vessel-card">
        <h3>Boil Kettle</h3>
        <svg class="vessel-svg" viewBox="0 0 100 150">
          <rect x="10" y="20" width="80" height="110" fill="none" stroke="#3d2418" stroke-width="2" rx="4"/>
          <rect x="10" y="40" width="80" height="90" fill="#ff6b35" opacity="0.6" rx="4"/>
          <text x="50" y="15" text-anchor="middle" fill="#ffa500" font-size="10">360L</text>
          <text x="50" y="85" text-anchor="middle" fill="#ff0" font-size="16">100°C</text>
        </svg>
        <div class="ctrl-panel">
          <button class="ctrl-btn active">BOIL</button>
          <button class="ctrl-btn">WHIRL</button>
          <button class="ctrl-btn">COOL</button>
        </div>
      </div>
      <div class="vessel-card">
        <h3>Whirlpool</h3>
        <svg class="vessel-svg" viewBox="0 0 100 150">
          <rect x="10" y="20" width="80" height="110" fill="none" stroke="#3d2418" stroke-width="2" rx="4"/>
          <text x="50" y="85" text-anchor="middle" fill="#666" font-size="14">STANDBY</text>
        </svg>
        <div class="ctrl-panel">
          <button class="ctrl-btn">FILL</button>
          <button class="ctrl-btn">WHIRL</button>
          <button class="ctrl-btn">XFER</button>
        </div>
      </div>
    </div>
    <div style="padding:15px;background:#0d0704;border-radius:8px;margin-top:15px">
      <h3 style="color:#ff6b35">Recipe: West Coast IPA</h3>
      <div class="phase-list">
        <div class="phase done">1. Strike - 74°C ✓</div>
        <div class="phase done">2. Mash - 67°C/60min ✓</div>
        <div class="phase done">3. Mash Out ✓</div>
        <div class="phase done">4. Sparge ✓</div>
        <div class="phase active">5. Boil - 39/60 min</div>
        <div class="phase">6. Hop @15</div>
        <div class="phase">7. Whirlpool</div>
        <div class="phase">8. Chill</div>
      </div>
    </div>
  </main>
  <footer class="ftr"><span>ISA-88 | 21 CFR 11</span></footer>
</body>
</html>
